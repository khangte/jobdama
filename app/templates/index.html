<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>잡담아</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>잡담아</h1>
      <p class="sub">채용공고 링크를 붙여넣으면 노션 채용 지원 관리 DB에 바로 저장한다.</p>
      <p class="sites">사람인 · 잡코리아 · 원티드 · 인크루트 · 점핏 · 그리팅 · 자소설닷컴 · 캐치 · 기업 채용 사이트</p>
    </header>

    {% if problems %}
    <section class="banner" role="alert">
      <strong>노션 설정 확인 필요</strong>
      <ul>{% for p in problems %}<li>{{ p }}</li>{% endfor %}</ul>
      <form method="post" action="/api/recheck"><button type="submit">다시 점검</button></form>
    </section>
    {% endif %}

    <label class="input-wrap" for="url">
      <span class="sr-only">공고 링크</span>
      <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" autofocus
             placeholder="여기에 공고 링크를 붙여넣기 (Ctrl+V)">
    </label>
    <p class="hint" id="hint">붙여넣는 즉시 접수된다. 직접 입력했다면 Enter.</p>

    <section aria-live="polite">
      <div id="jobs" hx-get="/jobs" hx-trigger="load, every 1s, job-submitted from:body" hx-swap="innerHTML">
        {% include "_jobs.html" ignore missing with context %}
      </div>
    </section>
  </main>
</body>
</html>
