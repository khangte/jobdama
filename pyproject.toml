[project]
name = "jobdama"
version = "0.1.0"
description = "채용공고 링크를 붙여넣으면 노션 채용 지원 관리 DB에 저장하는 로컬 웹"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "jinja2>=3.1",
    "pydantic-settings>=2.4",
    "notion-client>=3.1",
    "playwright>=1.47",
    "tzdata>=2024.1",  # 컨테이너에 시간대 DB가 없어도 Asia/Seoul을 쓰기 위해
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"  # pytest-asyncio 향후 기본값, 미설정 경고 방지
testpaths = ["tests"]

[tool.ruff]
line-length = 120  # 기존 코드 줄 길이에 맞춘다

[tool.ruff.lint]
# I001: 관련 이름을 한 줄에 묶는 기존 import 스타일을 유지한다(ruff isort는 한 줄에 하나씩만 지원)
# BLE001: 외부 라이브러리(노션·Playwright) 예외를 사용자 메시지·상태로 바꾸는 경계라서 Exception을 일부러 잡는다
ignore = ["I001", "BLE001"]
