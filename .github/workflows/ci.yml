name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12" # Docker 이미지(python:3.12)와 맞춘다
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
